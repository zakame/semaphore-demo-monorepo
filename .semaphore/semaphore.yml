version: v1.0
name: Monorepo Demo
agent:
  machine:
    type: s1-supernode-1
    os_image: ''
blocks:
  - name: "\U0001F469\U0001F3FB‍\U0001F3A8 — UI Service"
    dependencies: []
    run:
      when: 'change_in(''/services/ui'', {exclude: ''/services/ui/**/*.md'', pipeline_file: ''ignore'' })'
    task:
      agent:
        machine:
          type: s1-supernode-1
          os_image: ''
        containers:
        - name: main
          image: 252481841921.dkr.ecr.ap-southeast-1.amazonaws.com/semaphoreci/elixir:1.17
        image_pull_secrets:
          - name: ecr-pull

      prologue:
        commands:
          - checkout
          - cd services/ui
          - cache restore
          - mix local.hex --force
          - mix local.rebar --force
          - mix deps.get
          - mix deps.compile
          - cache store
      jobs:
        - name: Lint
          commands:
            - mix credo
        - name: Test
          commands:
            - mix test
  - name: "\U0001F64E — User Service"
    dependencies: []
    run:
      when: 'change_in(''/services/users'', {exclude: ''/services/users/**/*.md'', pipeline_file: ''ignore'' })'
    task:
      agent:
        machine:
          type: s1-supernode-1
          os_image: ''
        containers:
        - name: main
          image: 252481841921.dkr.ecr.ap-southeast-1.amazonaws.com/semaphoreci/ruby:2.7
        image_pull_secrets:
          - name: ecr-pull

      prologue:
        commands:
          - checkout
          - cd services/users
          - cache restore
          - bundle install
          - cache store
      jobs:
        - name: Lint
          commands:
            - bundle exec rubocop
        - name: Test
          commands:
            - bundle exec ruby test.rb
  - name: "\U0001F4B0 — Billing Service"
    dependencies: []
    run:
      when: 'change_in(''/services/billing'', {exclude: ''/services/billing/**/*.md'', pipeline_file: ''ignore'' })'
    task:
      agent:
        machine:
          type: s1-supernode-1
          os_image: ''
        containers:
        - name: main
          image: 252481841921.dkr.ecr.ap-southeast-1.amazonaws.com/semaphoreci/golang:1.22
        image_pull_secrets:
          - name: ecr-pull

      prologue:
        commands:
          - checkout
          - cd services/billing
          - cache restore
          - go get ./...
          - cache store
      jobs:
        - name: Lint
          commands:
            - gofmt -l .
        - name: Test
          commands:
            - go test ./...
